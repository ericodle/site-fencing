<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheshouzuo Fencing Club">
  <defs>
    <linearGradient id="sz-shaft" x1="8" y1="60" x2="56" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#007f5f"/>
      <stop offset=".55" stop-color="#00a06e"/>
      <stop offset="1" stop-color="#00e88a"/>
    </linearGradient>
    <linearGradient id="sz-head" x1="34" y1="14" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e88a"/>
      <stop offset="1" stop-color="#00a06e"/>
    </linearGradient>
  </defs>
  <!-- Sagittarius arrow: the shaft brightens toward the point -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M12 52 L50 14" stroke="url(#sz-shaft)"/>
    <path d="M34 14 H50 V30" stroke="url(#sz-head)"/>
    <path d="M22 32 L32 42" stroke="#879ba5" stroke-width="4.5"/>
  </g>
  <circle cx="12" cy="52" r="4.5" fill="#3a5268"/>
</svg>
