<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheshouzuo Fencing Club">
  <defs>
    <linearGradient id="sz-shaft" x1="8" y1="60" x2="56" y2="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8f7320"/><stop offset=".28" stop-color="#d4af37"/><stop offset=".46" stop-color="#fbf0c4"/><stop offset=".62" stop-color="#d4af37"/><stop offset="1" stop-color="#a8862a"/></linearGradient>
    <linearGradient id="sz-head" x1="34" y1="14" x2="50" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbf0c4"/><stop offset=".45" stop-color="#e0c25e"/><stop offset="1" stop-color="#9c7f26"/></linearGradient>
      <linearGradient id="sz-steel" x1="22" y1="32" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d858c"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#8b9298"/>
    </linearGradient>
  </defs>
  <!-- Sagittarius arrow: the gold shaft brightens toward the point, fletched in silver -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M12 52 L50 14" stroke="url(#sz-shaft)"/>
    <path d="M34 14 H50 V30" stroke="url(#sz-head)"/>
    <path d="M22 32 L32 42" stroke="url(#sz-steel)" stroke-width="4.5"/>
  </g>
  <circle cx="12" cy="52" r="4.5" fill="#7d858c"/>
</svg>
